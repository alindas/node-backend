# 应用基础配置
app:
  name: "adminApp"

# 上传配置
upload:
  maxSize: 5242880 # 5MB
  allowTypes:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"

# CORS配置
cors:
  origin: "*"
  allowMethods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
  allowHeaders:
    - "Content-Type"
    - "Authorization"

# 服务器配置
server:
  port: 5001
  host: "0.0.0.0"

# 日志配置
logger:
  level: "info"
  console: false

# JWT配置
jwt:
  secret: "your-secret-key"
  expiresIn: "2h"

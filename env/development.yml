# 开发环境特定配置
# 服务器配置
server:
  port: 5001
  host: "0.0.0.0" # 监听所有网络接口

database:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "root123"
  database: "node_admin"
  # 连接池配置
  # 连接池用于减少数据库连接的创建和销毁次数，提高数据库的性能和响应速度。
  pool:
    max: 10 # 最大连接数
    min: 0
    acquire: 30000 # 获取连接的超时时间，超过则请求连接失败
    idle: 10000 # 连接空闲时间，超过则被释放
  # 其他配置
  timezone: "+08:00"
  charset: "utf8mb4"
  logging: false

# Redis配置
redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
  connectTimeout: 10000
  # 连接池配置
  poolOptions:
    min: 2
    max: 10

# 日志配置覆盖
logger:
  level: "debug"
  console: false
